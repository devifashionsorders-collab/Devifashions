<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Admin - Add Product</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#f4f6fb; color:#222; margin:0; padding:20px; }
    header h1 { text-align:center; margin:0 0 18px 0; }
    .admin { max-width:820px; margin:20px auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 6px 18px rgba(10,10,20,0.06); }
    .admin label { display:block; margin:10px 0 6px; font-weight:600; color:#333; }
    .admin input[type="text"], .admin input[type="number"], .admin textarea, .admin select {
      width:100%; padding:10px 12px; border:1px solid #e2e6ef; border-radius:8px; box-sizing:border-box; font-size:14px;
    }
    .admin textarea { min-height:90px; resize:vertical; }
    .controls { display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap; }
    .btn { background:#25D366; color:#fff; padding:10px 14px; border-radius:8px; border:none; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn.secondary { background:#5561ff; }
    .note { font-size:13px; color:#666; margin-top:6px; }
    .hr { border-top:1px solid #eef1f8; margin:16px 0; }
    #message { margin-top:12px; font-weight:600; color:#0b6; min-height:20px; }
    .error { color:#c33; }
    .preview-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    .preview { width:96px; height:96px; border-radius:8px; overflow:hidden; border:1px solid #eee; background:#fafafa; display:flex; align-items:center; justify-content:center; }
    .preview img { width:100%; height:100%; object-fit:cover; display:block; }
    small.help { color:#7b7f8a; display:block; margin-top:6px; }
    .progress { height:8px; background:#f0f2f6; border-radius:999px; overflow:hidden; margin-top:8px; }
    .progress > span { display:block; height:100%; width:0%; background:linear-gradient(90deg,#38d67a,#28a745); transition:width .3s ease; }
  </style>
</head>
<body>
  <header><h1>Admin — Add Product</h1></header>

  <section class="admin" aria-labelledby="admin-title">
    <form id="addForm" enctype="multipart/form-data" autocomplete="off">
      <label>Product name
        <input name="name" required placeholder="e.g. Fancy Saree" />
      </label>

      <label>SKU
        <input name="sku" required placeholder="e.g. DF2006420" />
      </label>

      <label>Category
        <select name="category" id="categorySelect">
          <option value="Uncategorized">Uncategorized</option>
          <option value="Silk">Silk</option>
          <option value="Cotton">Cotton</option>
          <option value="Designer">Designer</option>
          <option value="Chiffon">Chiffon</option>
          <option value="Other">Other</option>
        </select>
      </label>

      <label>Price
        <input name="price" placeholder="e.g. 700" />
      </label>

      <label>Description
        <textarea name="description" placeholder="Short description (optional)"></textarea>
      </label>

      <label>Primary Image (single) <small class="help">Optional — used if you only want one image</small>
        <input type="file" name="image" accept="image/*" />
      </label>

      <label>Images (multiple, up to 10)
        <input type="file" name="images" accept="image/*" multiple />
      </label>
      <div class="preview-row" id="previewRow"></div>

      <div class="controls">
        <button class="btn" type="submit">Add Product</button>
        <button class="btn secondary" id="clearBtn" type="button">Clear Form</button>
        <div style="flex:1"></div>
        <div class="note">Tip: Use <strong>Images (multiple)</strong> to upload several photos at once.</div>
      </div>

    </form>

    <div class="hr"></div>

    <h2>Bulk CSV upload</h2>
    <p>CSV headers: <code>name,sku,description,price,imageUrl,category</code></p>
    <form id="csvForm" enctype="multipart/form-data">
      <input type="file" name="csvfile" accept=".csv" required />
      <div style="margin-top:8px;">
        <button class="btn" type="submit">Upload CSV</button>
      </div>
    </form>

    <div id="message" role="status"></div>

    <div class="progress" style="display:none;margin-top:6px"><span id="progBar" style="width:0%"></span></div>

    <p style="margin-top:14px"><a href="/" style="color:#5561ff;text-decoration:none">View Catalog</a></p>
  </section>

  <script>
  // helper to show messages
  const msgEl = document.getElementById('message');
  const prog = document.querySelector('.progress');
  const progBar = document.getElementById('progBar');

  function showMessage(text, isError=false) {
    msgEl.textContent = text || '';
    msgEl.classList.toggle('error', !!isError);
  }
  function setProgress(p) {
    prog.style.display = (p>0 && p<100) ? 'block' : (p>=100 ? 'block' : 'none');
    progBar.style.width = (Math.max(0, Math.min(100, Math.round(p))) + '%');
  }

  // image preview for file inputs
  const previewRow = document.getElementById('previewRow');
  function clearPreviews(){ previewRow.innerHTML = ''; }
  function addPreview(file) {
    const div = document.createElement('div');
    div.className = 'preview';
    const img = document.createElement('img');
    div.appendChild(img);
    previewRow.appendChild(div);
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.readAsDataURL(file);
  }

  // wire up preview on change
  document.querySelector('input[name="images"]').addEventListener('change', (e) => {
    clearPreviews();
    const files = Array.from(e.target.files || []);
    files.slice(0,10).forEach(f => addPreview(f));
  });
  // also show preview for single image input
  document.querySelector('input[name="image"]').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    // show single preview too (append)
    addPreview(file);
  });

  // Clear form helper
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('addForm').reset();
    clearPreviews();
    showMessage('');
    setProgress(0);
  });

  // Add Product handler (uses fetch with FormData)
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showMessage('');
    setProgress(0);

    const form = e.target;
    const formData = new FormData(form);

    // If user used the single image input but not the multi, and want multi to contain it,
    // we still send both — server will accept 'images' array or local image field.
    try {
      // Use fetch; if you want progress, use XHR; render's backend accepts both.
      // We provide a simple XHR to display progress.
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/products', true);

        xhr.upload.addEventListener('progress', (ev) => {
          if (ev.lengthComputable) {
            const pct = (ev.loaded / ev.total) * 100;
            setProgress(pct);
          }
        });

        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            setProgress(100);
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                const j = JSON.parse(xhr.responseText || '{}');
                if (j && j.ok) {
                  showMessage('Added: ' + (j.product && j.product.name ? j.product.name : 'Product saved'));
                  // reset form + previews after success
                  form.reset();
                  clearPreviews();
                  resolve();
                  return;
                } else {
                  showMessage('Error: ' + (j.error || 'unknown'), true);
                  reject(new Error(j.error || 'unknown'));
                  return;
                }
              } catch (err) {
                showMessage('Error parsing server response', true);
                reject(err);
                return;
              }
            } else {
              let errtext = 'Upload failed: ' + xhr.status + ' ' + xhr.statusText;
              try { const j = JSON.parse(xhr.responseText || '{}'); if (j && j.error) errtext += ' - ' + j.error; } catch(e){}
              showMessage(errtext, true);
              reject(new Error(errtext));
            }
          }
        };

        xhr.onerror = function() {
          showMessage('Network error while uploading', true);
          reject(new Error('network'));
        };

        xhr.send(formData);
      });

    } catch (err) {
      console.error('add product error', err);
    } finally {
      setTimeout(()=>setProgress(0), 800);
    }
  });

  // CSV upload handler
  document.getElementById('csvForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showMessage('');
    const f = e.target;
    const fd = new FormData(f);
    try {
      const res = await fetch('/api/upload-csv', { method: 'POST', body: fd });
      const j = await res.json();
      if (j.ok) {
        showMessage('CSV uploaded, added ' + (j.added || 0));
      } else {
        showMessage('Error: ' + (j.error || 'unknown'), true);
      }
    } catch (err) {
      showMessage('Network error uploading CSV', true);
      console.error(err);
    }
  });

  // small enhancement: prefill category from URL ?cat=Silk
  (function prefillFromQuery(){
    try {
      const params = new URLSearchParams(location.search);
      const cat = params.get('cat');
      if (cat) {
        const sel = document.getElementById('categorySelect');
        for (let i=0;i<sel.options.length;i++){
          if (sel.options[i].value.toLowerCase() === cat.toLowerCase()) { sel.selectedIndex = i; break; }
        }
      }
    } catch(e){}
  })();
  </script>
</body>
</html>
