<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Admin - Add Product</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin form label { display:block; margin:8px 0; }
    .admin input, .admin textarea, .admin select { width:100%; padding:8px; box-sizing:border-box; }
    .admin { max-width:700px; margin:20px auto; background:#fff; padding:18px; border-radius:8px; }
    .preview-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .preview { width:100px; height:100px; object-fit:cover; border-radius:6px; border:1px solid #ddd; }
    .progress-bar { height:8px; background:#eee; border-radius:6px; overflow:hidden; margin-top:8px; }
    .progress-bar > span { display:block; height:100%; background:linear-gradient(90deg,#5727A3,#8a5cf6); width:0%; transition:width .2s; }
    .small { font-size:0.9rem; color:#666; }
    .btn { background:#5727A3; color:#fff; border:none; padding:10px 14px; border-radius:6px; cursor:pointer; }
    .btn:disabled { opacity:0.6; cursor:not-allowed; }
  </style>
</head>
<body>
  <header><h1 style="text-align:center">Admin - Add Product</h1></header>

  <section class="admin">
    <form id="addForm" enctype="multipart/form-data">
      <label>Product name
        <input name="name" required />
      </label>

      <label>SKU
        <input name="sku" required />
      </label>

      <label>Category
        <select name="category" id="categorySelect">
          <option value="Uncategorized">Uncategorized</option>
          <option value="Silk">Silk</option>
          <option value="Cotton">Cotton</option>
          <option value="Designer">Designer</option>
          <option value="Chiffon">Chiffon</option>
          <option value="Other">Other</option>
        </select>
      </label>

      <label>Price
        <input name="price" />
      </label>

      <label>Description
        <textarea name="description"></textarea>
      </label>

      <label>Image (file)
        <input type="file" name="image" id="singleImage" accept="image/*" />
      </label>

      <label>Images (up to 10)
        <input type="file" name="images" id="multiImages" accept="image/*" multiple />
      </label>

      <div id="preview" class="preview-row" aria-hidden="true"></div>
      <div class="progress-bar" id="uploadProgress" style="display:none"><span></span></div>

      <div style="margin-top:12px">
        <button type="submit" class="btn" id="submitBtn">Add Product</button>
        <span id="status" class="small" style="margin-left:10px"></span>
      </div>
    </form>

    <hr/>

    <h2>Bulk CSV upload</h2>
    <p>CSV headers: <code>name,sku,description,price,imageUrl,category</code></p>
    <form id="csvForm" enctype="multipart/form-data">
      <input type="file" name="csvfile" accept=".csv" required />
      <button>Upload CSV</button>
    </form>

    <div id="message" style="margin-top:12px"></div>
    <p><a href="/">View Catalog</a></p>
  </section>

  <script>
  (function(){
    const MAX_FILES = 10;
    const MAX_FILE_SIZE = (window.MAX_FILE_SIZE || 5 * 1024 * 1024); // client default 5MB
    const ALLOWED = ['image/jpeg','image/png','image/webp','image/gif'];

    const singleInput = document.getElementById('singleImage');
    const multiInput = document.getElementById('multiImages');
    const preview = document.getElementById('preview');
    const progressBar = document.getElementById('uploadProgress');
    const progressSpan = progressBar.querySelector('span');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function resetUI() {
      preview.innerHTML = '';
      progressBar.style.display = 'none';
      progressSpan.style.width = '0%';
      status.innerText = '';
      message.innerText = '';
    }

    function showMessage(text, isError) {
      message.innerText = text;
      message.style.color = isError ? 'crimson' : 'inherit';
    }

    function fileToPreview(file) {
      const img = document.createElement('img');
      img.className = 'preview';
      img.alt = file.name;
      const reader = new FileReader();
      reader.onload = e => img.src = e.target.result;
      reader.readAsDataURL(file);
      return img;
    }

    function gatherFiles() {
      const arr = [];
      if (singleInput.files && singleInput.files[0]) arr.push(singleInput.files[0]);
      if (multiInput.files && multiInput.files.length) {
        for (let i=0;i<multiInput.files.length;i++) arr.push(multiInput.files[i]);
      }
      return arr;
    }

    function validateFiles(files) {
      if (!files || files.length === 0) return { ok:true };
      if (files.length > MAX_FILES) return { ok:false, error: `Max ${MAX_FILES} files allowed.` };
      for (const f of files) {
        if (!ALLOWED.includes(f.type)) return { ok:false, error: `File type not allowed: ${f.name}` };
        if (f.size > MAX_FILE_SIZE) return { ok:false, error: `File too large: ${f.name}` };
      }
      return { ok:true };
    }

    function renderPreviews() {
      preview.innerHTML = '';
      const files = gatherFiles();
      files.forEach(f => preview.appendChild(fileToPreview(f)));
    }

    singleInput.addEventListener('change', renderPreviews);
    multiInput.addEventListener('change', renderPreviews);

    // Try to fetch signing endpoint to know if direct-to-cloudinary is available
    async function fetchSigning() {
      try {
        const res = await fetch('/api/cloudinary-sign', { method: 'GET' });
        if (!res.ok) return null;
        const j = await res.json();
        // server should return { ok: true, cloudName: 'xxx' } at minimum
        return j;
      } catch (e) {
        return null;
      }
    }

    // Upload file to Cloudinary using signature (direct upload)
    // expects signResp: { timestamp, signature, apiKey, cloudName }
    async function uploadToCloudinaryDirect(file, signResp, onProgress) {
      // Cloudinary upload URL:
      const cloudName = signResp.cloudName;
      const url = `https://api.cloudinary.com/v1_1/${encodeURIComponent(cloudName)}/auto/upload`;

      const fd = new FormData();
      fd.append('file', file);
      // signature params
      fd.append('api_key', signResp.apiKey);
      fd.append('timestamp', signResp.timestamp);
      fd.append('signature', signResp.signature);
      if (signResp.upload_preset) fd.append('upload_preset', signResp.upload_preset);

      // Use XMLHttpRequest to get progress events
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', url);
        xhr.onload = function() {
          if (xhr.status >= 200 && xhr.status < 300) {
            try { resolve(JSON.parse(xhr.responseText)); } catch (e) { resolve({}); }
          } else {
            reject(new Error('Cloudinary upload failed: ' + xhr.status));
          }
        };
        xhr.onerror = () => reject(new Error('Cloudinary upload network error'));
        if (xhr.upload && onProgress) {
          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) onProgress(Math.round((ev.loaded/ev.total)*100));
          };
        }
        xhr.send(fd);
      });
    }

    // POST product metadata + cloud URLs to /api/products-json
    async function postProductJson(data) {
      const res = await fetch('/api/products-json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return res.json();
    }

    // Fallback: send multipart form (existing flow)
    async function postProductFormData(formData, onProgress) {
      // We can't get progress reliably with fetch; use XHR if we want a progress
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/products');
        xhr.onload = function() {
          if (xhr.status >= 200 && xhr.status < 300) {
            try { resolve(JSON.parse(xhr.responseText)); } catch (e) { resolve({}); }
          } else {
            reject(new Error('Upload failed: ' + xhr.status));
          }
        };
        xhr.onerror = () => reject(new Error('Network error'));
        if (xhr.upload && onProgress) {
          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) onProgress(Math.round((ev.loaded/ev.total)*100));
          };
        }
        xhr.send(formData);
      });
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      resetUI();
      submitBtn.disabled = true;
      status.innerText = 'Preparing...';

      const form = e.target;
      const files = gatherFiles();
      const v = validateFiles(files);
      if (!v.ok) {
        showMessage(v.error, true);
        submitBtn.disabled = false;
        return;
      }

      // attempt to see if server supports cloudinary signing
      const signResp = await fetchSigning();

      if (signResp && signResp.ok && signResp.cloudName && signResp.apiKey && signResp.timestamp && signResp.signature) {
        // direct-to-cloudinary flow
        status.innerText = 'Uploading to Cloudinary...';
        progressBar.style.display = files.length ? 'block' : 'none';

        const uploadedUrls = [];
        let overallProgress = 0;

        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          try {
            const r = await uploadToCloudinaryDirect(f, signResp, (p) => {
              // approximate cumulative progress: (i + p/100) / files.length
              const cum = Math.round(((i + (p/100)) / files.length) * 100);
              progressSpan.style.width = cum + '%';
              status.innerText = `Uploading ${i+1}/${files.length} — ${p}%`;
            });
            // r.secure_url or r.url
            uploadedUrls.push(r.secure_url || r.url || '');
          } catch (err) {
            console.warn('Direct upload failed for file', f.name, err);
            // if direct upload fails for any file we fallback to server multipart
            showMessage('Direct upload failed, falling back to server upload.', true);
            submitBtn.disabled = false;
            // perform fallback path below
            return fallbackMultipartSubmit(new FormData(form));
          }
        }

        // Now submit product metadata with uploadedUrls to server (JSON endpoint)
        try {
          status.innerText = 'Saving product...';
          const payload = {
            name: form.name.value,
            sku: form.sku.value,
            category: form.category.value,
            price: form.price.value,
            description: form.description.value,
            images: uploadedUrls
          };
          // attempt JSON endpoint
          const j = await postProductJson(payload);
          if (j && j.ok) {
            showMessage('Added: ' + (j.product && j.product.name ? j.product.name : '(no name)'));
            form.reset();
            preview.innerHTML = '';
          } else {
            // fallback if server does not support JSON endpoint
            showMessage('Product saved remotely but server rejected JSON endpoint; falling back to FormData post.', true);
            return fallbackMultipartSubmit(new FormData(form));
          }
        } catch (err) {
          console.error('Product JSON save failed', err);
          showMessage('Failed to save product metadata to server; falling back to FormData upload.', true);
          return fallbackMultipartSubmit(new FormData(form));
        } finally {
          submitBtn.disabled = false;
          progressBar.style.display = 'none';
          progressSpan.style.width = '0%';
        }

      } else {
        // no signing endpoint — use existing server endpoint (multipart)
        return fallbackMultipartSubmit(new FormData(form));
      }
    });

    async function fallbackMultipartSubmit(formData) {
      try {
        progressBar.style.display = 'block';
        const res = await postProductFormData(formData, (p) => {
          progressSpan.style.width = p + '%';
        });
        if (res && res.ok) {
          showMessage('Added: ' + (res.product && res.product.name ? res.product.name : '(no name)'));
          document.getElementById('addForm').reset();
          preview.innerHTML = '';
        } else {
          showMessage('Error: ' + (res && res.error ? res.error : 'unknown'), true);
        }
      } catch (err) {
        console.error(err);
        showMessage('Upload failed: ' + err.message, true);
      } finally {
        submitBtn.disabled = false;
        progressBar.style.display = 'none';
        progressSpan.style.width = '0%';
      }
    }

    // CSV form: keep original behaviour
    document.getElementById('csvForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const formData = new FormData(f);
      try {
        showMessage('Uploading CSV...');
        const res = await fetch('/api/upload-csv', { method: 'POST', body: formData });
        const j = await res.json();
        if (j.ok) {
          showMessage(`CSV uploaded, added ${j.added}`);
          f.reset();
        } else {
          showMessage('Error: ' + (j.error || 'unknown'), true);
        }
      } catch (err) {
        showMessage('Network error: ' + err.message, true);
      }
    });

    // show previews if page loads with files (dev)
    renderPreviews();
  })();
  </script>
  <script src="/js/wa-order.js"></script>

</body>
</html>
